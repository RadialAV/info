<style>
:root{
  --bg:#070708;
  --surface:rgba(255,255,255,0.04);
  --surface-hi:rgba(255,255,255,0.07);
  --border:rgba(245,242,234,0.12);
  --border-strong:rgba(245,242,234,0.28);
  --text:#f5f2ea;
  --text-secondary:#aba79e;
  --text-muted:#74716a;
  --accent:#ded7c4;
  --cyan:#96c8eb;
  --radius:6px;
  --font-serif:'Bodoni Moda','Didot','Times New Roman',serif;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100dvh;
}

/* ── 3D RINGS BACKGROUND ── */
.bg-rings{
  position:fixed;inset:0;z-index:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;overflow:hidden;
  perspective:500px;perspective-origin:50% 50%;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
}
.atom{
  position:relative;width:1200px;height:1200px;
  transform-style:preserve-3d;will-change:transform;
  transform:translateZ(0);
}
.ring-group{
  position:absolute;top:50%;left:50%;
  transform-style:preserve-3d;will-change:transform;
}
.ring-group .r{
  position:absolute;inset:0;border-radius:50%;border-style:solid;
  transform-style:preserve-3d;will-change:transform;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.ring-core{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);z-index:2;
  width:3px;height:180px;
  background:linear-gradient(180deg,transparent,rgba(222,215,196,0.65) 20%,rgba(170,210,235,0.8) 50%,rgba(222,215,196,0.65) 80%,transparent);
  opacity:0.9;pointer-events:none;
  box-shadow:0 0 30px rgba(170,210,235,0.3),0 0 60px rgba(222,215,196,0.2);
}
.foam-line{
  position:fixed;left:0;width:100%;height:1.5px;
  pointer-events:none;z-index:1;opacity:0.5;
  background:linear-gradient(90deg,transparent 5%,rgba(160,210,240,0.6) 15%,rgba(140,200,235,0.8) 25%,rgba(160,210,240,0.5) 35%,transparent 40%,rgba(140,200,235,0.3) 50%,rgba(160,210,240,0.6) 60%,transparent 70%,rgba(140,200,235,0.4) 80%,rgba(160,210,240,0.6) 90%,transparent 95%);
  filter:blur(0.5px);
  box-shadow:0 0 8px rgba(160,210,240,0.3),0 0 20px rgba(140,200,235,0.15);
}

/* ── LAYOUT ── */
.page{
  position:relative;z-index:2;
  min-height:100dvh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);
}

/* ── BRAND ── */
.brand{
  display:flex;flex-direction:column;align-items:center;
  gap:10px;margin-top:auto;margin-bottom:auto;
  width:100%;max-width:420px;
}
.brand__logo{
  width:60px;height:60px;object-fit:contain;
  animation:rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s both;
  filter:drop-shadow(0 0 24px rgba(150,200,235,0.35));
}
.brand__name{
  font-family:var(--font-serif);
  font-size:clamp(2rem,11.5vw,3.2rem);
  font-weight:400;
  letter-spacing:0.06em;
  line-height:1;
  text-transform:uppercase;
  text-align:center;
  animation:rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.15s both;
}
.brand__name span{display:block;font-size:clamp(0.62rem,3.4vw,0.92rem);letter-spacing:0.32em;color:var(--text-secondary);margin-top:0.7em;font-family:var(--font-sans);font-weight:300;text-transform:uppercase;text-indent:0.32em}
.brand__tag{
  font-size:0.78rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--text-muted);font-weight:300;
  animation:rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.25s both;
  text-align:center;
}
.brand__rule{
  width:100%;max-width:180px;height:1px;
  background:linear-gradient(90deg,transparent,var(--border-strong),transparent);
  animation:rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s both;
}

/* ── LINKS ── */
.links{
  display:flex;flex-direction:column;gap:9px;
  width:100%;max-width:420px;margin-top:16px;
}
.link{
  position:relative;
  display:flex;align-items:center;gap:13px;
  padding:12px 16px;
  background:var(--surface);
  border:0.5px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  text-decoration:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:border-color 0.35s ease,background 0.35s ease,transform 0.35s cubic-bezier(0.16,1,0.3,1),box-shadow 0.35s ease;
  overflow:hidden;
  animation:rise 0.8s cubic-bezier(0.16,1,0.3,1) both;
}
.link:nth-child(1){animation-delay:0.34s}
.link:nth-child(2){animation-delay:0.41s}
.link:nth-child(3){animation-delay:0.48s}
.link:nth-child(4){animation-delay:0.55s}
.link:nth-child(5){animation-delay:0.62s}
.link::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(150,200,235,0.10) 50%,transparent 70%);
  transform:translateX(-100%);
  transition:transform 0.7s cubic-bezier(0.16,1,0.3,1);
  pointer-events:none;
}
.link:active{transform:scale(0.985)}
.link:active::after{transform:translateX(100%)}

.link__icon{
  flex:0 0 auto;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border:0.5px solid var(--border);
  border-radius:50%;
  color:var(--accent);
  transition:color 0.35s ease,border-color 0.35s ease,box-shadow 0.35s ease;
}
.link__icon svg{width:16px;height:16px;display:block}

.link__body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.link__label{
  font-size:0.86rem;font-weight:500;letter-spacing:0.04em;
  line-height:1.2;
}
.link__sub{
  font-size:0.66rem;color:var(--text-muted);letter-spacing:0.06em;
  text-transform:uppercase;font-weight:300;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.link__arrow{
  flex:0 0 auto;color:var(--text-muted);
  transition:transform 0.35s cubic-bezier(0.16,1,0.3,1),color 0.35s ease;
}
.link__arrow svg{width:14px;height:14px;display:block}

/* Hover (desktop) */
@media (hover:hover){
  .link:hover{
    background:var(--surface-hi);
    border-color:var(--border-strong);
    box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 0 0.5px rgba(245,242,234,0.08) inset;
  }
  .link:hover .link__icon{color:var(--cyan);border-color:rgba(150,200,235,0.45);box-shadow:0 0 18px rgba(150,200,235,0.25)}
  .link:hover .link__arrow{transform:translateX(4px);color:var(--text)}
}

/* ── FOOTER ── */
.foot{
  margin-top:auto;padding-top:14px;
  font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--text-muted);text-align:center;font-weight:300;
  animation:rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.7s both;
}
.foot a{color:var(--text-secondary);text-decoration:none;transition:color 0.3s}
.foot a:active{color:var(--text)}

@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}


/* ── FAILSAFE: guarantee visibility even if animations freeze ── */
.no-anim .brand__logo,
.no-anim .brand__name,
.no-anim .brand__tag,
.no-anim .brand__rule,
.no-anim .link,
.no-anim .foot{
  animation:none !important;
  opacity:1 !important;
  transform:none !important;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
  .brand__logo,.brand__name,.brand__tag,.brand__rule,.link,.foot{opacity:1;transform:none}
}
</style>
</head>

<script>
(function(){
  "use strict";
  var rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var atom = document.getElementById("ringsAtom");
  var foam = document.getElementById("foamLine");
  if(!atom) return;

  var rings = atom.querySelectorAll(".r");
  var speeds = [-0.8,0.6,-0.5,0.4,-0.35,0.3,-0.25,0.2,-0.18,0.15,-0.12,0.1,-0.08,0.05,0.04];
  var curY = 0, curX = 0, running = false;
  var idle = 0;

  // Deterministic ring seed so each ring has a stable phase
  for (var i = 0; i < rings.length; i++){
    rings[i].dataset.seed = (i * 0.7 + 0.3).toFixed(2);
  }

  function update(){
    var scrollMax = Math.max(1, document.body.scrollHeight - window.innerHeight);
    var p = Math.min(1, Math.max(0, window.scrollY / scrollMax));
    var a = p * Math.PI * 2;

    // Scroll drives rotation; on a short page, idle time also drives it
    idle += 0.0022;
    var drive = rm ? 0 : (p * 360 + idle * 360);
    var tgtY = drive % 360;
    var tgtX = Math.sin(a + idle * 2) * 12;

    curY += (tgtY - curY) * 0.10;
    curX += (tgtX - curX) * 0.10;

    var dY = Math.abs(curY - tgtY), dX = Math.abs(curX - tgtX);
    atom.style.transform = "rotateY(" + curY.toFixed(1) + "deg) rotateX(" + curX.toFixed(1) + "deg)";

    for (var i = 0; i < rings.length; i++){
      var r = rings[i];
      var g = r.parentElement;
      var tilt = parseFloat(g.getAttribute("data-tilt") || "0");
      var seed = parseFloat(r.dataset.seed || "0");
      var ry = Math.sin(a + seed + idle * 3) * 180 * speeds[i % speeds.length];
      r.style.transform = "rotateY(" + ry.toFixed(1) + "deg) rotateX(" + tilt + "deg)";
    }

    if (foam){
      foam.style.top = (20 + p * 60) + "%";
      foam.style.opacity = 0.3 + p * 0.4;
    }

    if (!rm && (dY > 0.35 || dX > 0.35 || Math.abs(idle) > 0)){
      running = true;
      requestAnimationFrame(update);
    } else {
      running = false;
    }
  }

  window.addEventListener("scroll", function(){
    if (!running) requestAnimationFrame(update);
  }, {passive:true});

  // Start the loop
  requestAnimationFrame(update);

  // Failsafe: if entrance animations didn't run, force everything visible
  setTimeout(function(){
    var probe = document.querySelector(".link");
    if (!probe) return;
    var op = window.getComputedStyle(probe).opacity;
    if (parseFloat(op) < 0.9) {
      document.documentElement.classList.add("no-anim");
    }
  }, 1700);

  // Year
  var y = document.getElementById("year");
  if (y) y.textContent = new Date().getFullYear();
})();
</script>
